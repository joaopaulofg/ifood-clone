server:
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5434/catalogdb
    username: catalog
    password: catalog
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  sql:
    init:
      mode: always
      platform: postgres
      schema-locations: classpath:init.sql

logging:
  level:
    com.joaopaulofg.catalog: INFO
